name: Treinar THIGAS AI 0.3B e 0.6B
on:
  push:
    branches: [train-thigas-03b-06b]
    paths:
      - "models/treino_03b_06b/**"
      - ".github/workflows/train-thigas-03b-06b.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fine_tuning:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nano
            release_tag: thigas-nano-03b-v1
            artifact: THIGAS_AI_nano_03B_Q4_K_M.gguf
            context: 2048
          - variant: mini
            release_tag: thigas-mini-06b-v1
            artifact: THIGAS_AI_mini_06B_Q4_K_M.gguf
            context: 4096
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verificar memória e espaço
        run: |
          free -h
          df -h .
          nproc
          python -m py_compile models/treino_03b_06b/treinar.py
      - name: Instalar bibliotecas para treinamento CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.57.3" "peft==0.17.1" "accelerate==1.10.1" "huggingface_hub>=0.34,<1" safetensors sentencepiece protobuf
      - name: Executar treinamento supervisionado LoRA e fundir pesos
        run: |
          python -u models/treino_03b_06b/treinar.py --variant "${{ matrix.variant }}" --output ./build_models
      - name: Compilar utilitários GGUF de llama.cpp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev cmake g++
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/thigas-llama
          python -m pip install /tmp/thigas-llama/gguf-py
          cmake -S /tmp/thigas-llama -B /tmp/thigas-llama/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/thigas-llama/build -j 4 --target llama-quantize llama-server
      - name: Converter pesos fundidos e quantizar Q4_K_M
        run: |
          python /tmp/thigas-llama/convert_hf_to_gguf.py "./build_models/${{ matrix.variant }}/merged" \
            --outfile /tmp/thigas-f16.gguf --outtype f16
          /tmp/thigas-llama/build/bin/llama-quantize /tmp/thigas-f16.gguf "${{ matrix.artifact }}" Q4_K_M
          test -s "${{ matrix.artifact }}"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          gguf=Path("${{ matrix.artifact }}")
          report=json.loads(Path("build_models/${{ matrix.variant }}/report.json").read_text())
          with gguf.open('rb') as f:
              assert f.read(4)==b'GGUF'
          report['filename']=gguf.name
          report['bytes']=gguf.stat().st_size
          report['sha256']=hashlib.sha256(gguf.read_bytes()).hexdigest()
          report['quantization']='Q4_K_M'
          report['tested_inference_context']=int("${{ matrix.context }}")
          Path("train_report_${{ matrix.variant }}.json").write_text(
            json.dumps(report,indent=2,ensure_ascii=False),encoding='utf8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Preservar pesos GGUF como artefatos, mesmo se o teste de geração falhar
        uses: actions/upload-artifact@v4
        with:
          name: modelo-${{ matrix.variant }}-GGUF
          path: |
            ${{ matrix.artifact }}
            train_report_${{ matrix.variant }}.json
          retention-days: 30
      - name: Provar inferência real via llama-server HTTP API e janela completa
        run: |
          set -euo pipefail
          /tmp/thigas-llama/build/bin/llama-server \
            -m "${{ matrix.artifact }}" -c "${{ matrix.context }}" \
            --host 127.0.0.1 --port 18735 --api-key chave-de-teste-123456 \
            --alias "THIGAS_AI_${{ matrix.variant }}" \
            > "./servidor_${{ matrix.variant }}.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          if python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          url='http://127.0.0.1:18735'
          headers={'Authorization':'Bearer chave-de-teste-123456'}
          for i in range(120):
              try:
                  req=urllib.request.Request(url+'/health',headers=headers)
                  with urllib.request.urlopen(req,timeout=2) as response:
                      health=json.loads(response.read())
                  if health.get('status')=='ok' or health.get('status')=='no slot available':
                      break
              except (urllib.error.URLError,TimeoutError,ValueError):
                  pass
              time.sleep(1)
          else:
              raise RuntimeError('llama-server não iniciou ou não respondeu a /health')
          data={'model':'THIGAS_AI_${{ matrix.variant }}',
                'messages':[{'role':'system','content':'Você é THIGAS AI. Responda em português do Brasil.'},
                            {'role':'user','content':'Explique em uma frase o que é Python. /no_think'}],
                'temperature':0.2,'max_tokens':72,'stream':False}
          req=urllib.request.Request(
              url+'/v1/chat/completions',
              data=json.dumps(data).encode('utf-8'),
              headers={**headers,'Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(req,timeout=150) as response:
              payload=json.load(response)
          choice=payload['choices'][0]
          result=str(choice['message'].get('content') or '').strip()
          if not result:
              raise RuntimeError('API respondeu sem texto: '+json.dumps(payload)[:600])
          Path('amostra_${{ matrix.variant }}.txt').write_text(result,encoding='utf8')
          print('Carregou GGUF, inferiu pelo OpenAI chat/completions, resposta:',result[:400])
          PY
          then
            echo "Teste HTTP concluído com sucesso, contexto ${{ matrix.context }} tokens"
          else
            tail -n 120 "./servidor_${{ matrix.variant }}.log" || true
            exit 1
          fi
      - name: Publicar modelo GGUF treinado na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ matrix.release_tag }}" \
             "${{ matrix.artifact }}" \
             "train_report_${{ matrix.variant }}.json" \
             "amostra_${{ matrix.variant }}.txt" \
             --repo "${{ github.repository }}" \
             --target "${{ github.sha }}" \
             --title "THIGAS AI ${{ matrix.variant }} GGUF Q4_K_M" \
             --notes "Base Apache 2.0 ajustada por LoRA neste projeto. Veja o relatório de treino, sha256, contexto de teste e limitações."
