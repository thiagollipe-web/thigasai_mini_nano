name: Cancelar treinos duplicados
on:
  push:
    branches: [train-thigas-03b-06b]
    paths: [".github/workflows/cancel-duplicate-training.yml"]
permissions:
  contents: read
  actions: write
jobs:
  cancelar:
    runs-on: ubuntu-latest
    steps:
      - name: Interromper execuções repetidas sem tocar na original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/38193450699/cancel" || true
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/38193475944/cancel" || true
