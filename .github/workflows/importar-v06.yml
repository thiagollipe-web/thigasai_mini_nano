name: Importar arquivos THIGAS AI Mini + Nano
on:
  push:
    branches: [main]
    paths:
      - "upload/parts/**"
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar e extrair os arquivos da versão 0.6
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          root = Path.cwd()
          archive = ''.join(p.read_text().strip() for p in sorted((root / "upload/parts").glob("*.b64")))
          if not archive:
              raise SystemExit("Pacote não encontrado.")
          data = lzma.decompress(base64.b64decode(archive, validate=True))
          expected = "47cf36d42bfe47f5ef0ec112b18645ac6b38ff5bb7b916c534a5777653d42d4c"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Falha de integridade: arquivo transferido não corresponde ao original.")
          files = json.loads(data.decode("utf-8"))
          if len(files) != 18:
              raise SystemExit("Quantidade inesperada de arquivos.")
          for name, content in files.items():
              p = Path(name)
              if p.is_absolute() or ".." in p.parts or p.parts[0] in (".github", "upload"):
                  raise SystemExit("Caminho não permitido: " + name)
              target = root / p
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")
          print("Importados", len(files), "arquivos; SHA256 conferido.")
          PY
          rm -rf upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publicar THIGAS AI Mini + Nano v0.6 (18 arquivos)"
          git push
