name: Verificar THIGAS AI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Verificar sintaxe Python
        run: python -m compileall -q web_cloud.py thigas_wiki.py site_tools.py
      - name: Executar testes sem consumo de API
        run: python -m unittest discover -s tests -v
      - name: Verificar JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('<script>') == 1
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/thigas-check.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/thigas-check.js
      - name: Testar persistência do histórico local
        run: node --test tests/history.test.js
      - name: Testar formatação segura das respostas
        run: |
          node --check chat_format.js
          node --test tests/chat_format.test.js
