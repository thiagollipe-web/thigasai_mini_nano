name: Verificar GGUF no navegador e no backend
on:
  push:
    branches: [train-thigas-03b-06b]
    paths:
      - "local_gguf.js"
      - "index.html"
      - "web_cloud.py"
      - "tests/test_browser_gguf.py"
      - ".github/workflows/verify-browser-gguf.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependências do site
        run: python -m pip install -r requirements.txt
      - name: Testes HTTP da API e WASM
        run: |
          python -m compileall -q web_cloud.py site_tools.py thigas_wiki.py
          python -m unittest discover -s tests -v
      - name: JavaScript e histórico
        run: |
          node --check local_gguf.js
          node --check history_store.js
          node --test tests/history.test.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('<script>')==1
          Path('/tmp/thigas-index.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/thigas-index.js
