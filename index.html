<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4c523a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="THIGAS AI">
<meta name="description" content="THIGAS AI — chat com esforço ajustável, Wikipédia, documentos, imagens e ditado.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/capivara.svg">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<title>THIGAS AI — Seu assistente</title>
<style>
:root{color-scheme:light;--bg:#f8f7f3;--surface:#fff;--text:#292821;--muted:#68675d;--line:#deded4;--green:#4c523a;--green-2:#3a432e;--brown:#926447;--soft:#f1f0ea;--focus:#ad7652}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:15px/1.58 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button:disabled{opacity:.48;cursor:not-allowed}[hidden]{display:none!important}
.app{height:100dvh;min-height:350px;display:flex;flex-direction:column;position:relative}
.topbar{flex:none;background:#fffefcdd;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);z-index:4}
.top-inner{max-width:1160px;padding:10px 22px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand img{width:48px;height:48px;object-fit:contain;border-radius:13px;background:#fff;border:1px solid #ebe7dd;padding:2px}
.brand strong{font-size:19px;letter-spacing:-.4px;color:var(--green);display:block;line-height:1.12}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.top-actions{display:flex;align-items:center;gap:7px}.text-btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-size:13px;font-weight:650}.text-btn:hover{background:var(--soft)}
#install-pwa{background:var(--green);color:#fff;border-color:var(--green)}
.chat-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.conversation{width:min(810px,100%);margin:0 auto;padding:24px 20px 20px}
.welcome{min-height:48vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:28px 3px}
.welcome img{width:78px;height:78px;object-fit:contain}
.welcome h1{font-size:clamp(26px,5vw,35px);letter-spacing:-1px;margin:0;font-weight:680}
.welcome p{max-width:440px;color:var(--muted);margin:0}
.suggest-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:min(520px,100%);margin-top:20px}
.suggest-grid button{border:1px solid var(--line);background:#fff;text-align:left;border-radius:15px;padding:13px 15px;min-height:62px;color:var(--text);font-size:13px}
.suggest-grid button:hover{border-color:#9ca589;background:#f8f9f4}
.suggest-grid button b{display:block;font-size:12px;color:var(--brown);margin-bottom:2px}
.msg{display:flex;gap:11px;align-items:flex-start;margin:23px 0}
.msg.user{justify-content:flex-end}.msg.user .avatar{display:none}
.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:white;border:1px solid var(--line)}.avatar img{width:27px;height:27px;object-fit:contain}
.msg-body{min-width:0;max-width:100%;line-height:1.7;overflow-wrap:anywhere}
.msg.assistant .msg-body{flex:1;padding-top:3px}
.msg.user .msg-body{max-width:min(660px,87%);background:#e7e9df;border-radius:20px 20px 6px 20px;padding:10px 15px}
.msg-text{white-space:pre-wrap}
.sources{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.sources a{border:1px solid #ced4bf;border-radius:9px;background:#f0f3eb;color:var(--green-2);text-decoration:none;font-size:12px;padding:5px 9px}
.sources a:hover{text-decoration:underline}
.message-tools{display:flex;gap:8px;margin-top:7px}
.message-tools button{border:0;background:transparent;color:var(--muted);padding:3px 7px;font-size:12px;border-radius:8px}
.message-tools button:hover{background:#ebece4}
.msg.pending .msg-body{color:var(--muted)}
.composer-zone{position:relative;flex:none;padding:10px 16px max(13px,env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 82%,#f8f7f3ee)}
.composer-wrap{width:min(810px,100%);margin:auto;position:relative}
.editor{border:1px solid #c9c9bc;border-radius:23px;background:var(--surface);padding:13px 12px 9px;box-shadow:0 5px 22px #2b241f10}
.editor:focus-within{border-color:#899176;box-shadow:0 5px 25px #2b241f16}
#prompt{display:block;width:100%;resize:none;min-height:48px;max-height:180px;overflow:auto;background:transparent;color:var(--text);border:0;outline:none;line-height:1.5;padding:6px 9px;font-size:15px}
#prompt::placeholder{color:#848578}
.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px}
.tool-cluster{display:flex;align-items:center;gap:7px;min-width:0}.tool{height:38px;min-width:38px;padding:0 11px;border:0;border-radius:12px;background:transparent;display:inline-flex;gap:7px;align-items:center;justify-content:center;font-weight:650;font-size:13px}
.tool:hover,.tool[aria-expanded="true"]{background:var(--soft)}
.tool.icon-only{font-size:23px;font-weight:420;padding:0;width:38px}
.tool .muted{color:var(--muted);font-weight:520}
.tool[data-listening="true"]{color:#af2c22;background:#ffefed}
#send{height:39px;width:39px;border:0;border-radius:13px;background:var(--green);color:#fff;font-size:20px;font-weight:700;display:grid;place-items:center}
#send:hover:not(:disabled){background:var(--green-2)}
.combo{position:relative}
.popup{position:absolute;bottom:calc(100% + 9px);left:0;z-index:20;min-width:244px;max-width:min(350px,92vw);background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 18px 50px #201e1b24;padding:8px}
.popup-title{padding:6px 11px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.popup button{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;text-align:left;padding:10px;border-radius:11px;font-size:13px}
.popup button:hover,.popup button.active{background:#f0f2ea}
.popup button .sym{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#f4f2ea;flex:none}
.popup small{display:block;color:var(--muted);font-size:11px}
#effort-popup{min-width:255px}
.quick-menu{position:absolute;bottom:calc(100% + 12px);left:3px;right:3px;z-index:22;max-height:290px;overflow:auto;border-radius:17px;border:1px solid var(--line);box-shadow:0 18px 50px #201e1b22;background:white;padding:8px}
.quick-menu button{display:flex;text-align:left;gap:12px;align-items:center;width:100%;border:0;background:transparent;border-radius:10px;padding:9px 11px}
.quick-menu button:hover,.quick-menu button.active{background:#eff1e9}
.quick-menu strong{font-size:13px}.quick-menu small{display:block;color:var(--muted);font-size:11px}
.status-line{width:min(810px,100%);margin:7px auto 0;font-size:11px;color:#76776c;text-align:center}
#status{color:#626c4c}.status-line strong{font-weight:600}
.attachment{display:flex;align-items:center;gap:10px;border:1px solid #c8d0bd;background:#f0f3eb;border-radius:13px;padding:9px 11px;margin-bottom:8px;color:var(--green-2);font-size:12px}
.attachment img{width:45px;height:45px;object-fit:cover;border-radius:9px}
.attachment span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attachment button{border:0;background:#e1e7d8;border-radius:9px;padding:5px 8px}
.site-panel{padding:13px;background:white;border:1px solid var(--line);border-radius:15px;margin-bottom:9px}
.site-panel label{display:block;font-weight:650;font-size:12px;margin-bottom:7px}
.site-controls{display:flex;gap:8px}
.site-controls input{flex:1;min-width:0;border:1px solid #c5cabc;border-radius:10px;padding:10px;background:white}
.site-controls button{border:0;background:var(--green);color:white;border-radius:10px;font-weight:650;padding:8px 14px}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);width:max-content;max-width:90vw;border:1px solid #cdcbbf;background:#fffefb;padding:9px 15px;border-radius:12px;box-shadow:0 12px 35px #2222;z-index:35;color:var(--green-2);font-size:13px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:580px){
 .top-inner{padding:8px 12px}.brand img{width:42px;height:42px}.brand strong{font-size:17px}.brand small{font-size:10px}
 .text-btn{padding:7px 9px;font-size:12px}.conversation{padding:10px 12px 8px}.welcome{min-height:42vh}
 .suggest-grid{grid-template-columns:1fr 1fr}.suggest-grid button{padding:10px;min-height:69px}
 .composer-zone{padding:7px 8px max(9px,env(safe-area-inset-bottom))}.editor{border-radius:19px;padding:10px 8px 7px}
 #prompt{font-size:16px}.tool{padding:0 7px;font-size:12px}.tool-cluster{gap:2px}
 .popup{left:-2px}.site-controls{flex-wrap:wrap}.site-controls button{width:100%}
 .msg.user .msg-body{max-width:90%}
}
@media(max-height:550px){.welcome{min-height:10vh;padding:8px}.welcome img{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="top-inner">
  <div class="brand">
   <img src="/assets/capivara.svg" alt="Símbolo da capivara do THIGAS AI">
   <div><strong>THIGAS AI</strong><small>Assistente de pesquisa e criação</small></div>
  </div>
  <div class="top-actions">
   <button id="new-chat" class="text-btn" type="button">＋ Nova conversa</button>
   <button id="install-pwa" class="text-btn" type="button" hidden>Instalar app</button>
  </div>
 </div>
</header>
<div id="chat-scroll" class="chat-scroll">
 <main id="conversation" class="conversation" role="log" aria-live="polite" aria-label="Conversa"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<footer class="composer-zone">
 <div class="composer-wrap">
  <div id="attachment" class="attachment" hidden>
   <img id="image-preview" alt="Miniatura do anexo" hidden>
   <span id="attachment-label"></span>
   <button id="remove-attachment" type="button" aria-label="Remover anexo">✕</button>
  </div>
  <div id="site-panel" class="site-panel" hidden>
   <label for="site-url">Analisar página pública HTTPS</label>
   <div class="site-controls">
    <input id="site-url" type="url" maxlength="1100" inputmode="url" placeholder="https://exemplo.org/artigo" autocomplete="url">
    <button type="button" id="load-site">Consultar</button>
   </div>
  </div>
  <div id="quick-menu" class="quick-menu" role="listbox" aria-label="Atalhos de pesquisa" hidden></div>
  <form id="composer" class="editor">
   <label for="prompt" class="sr-only">Mensagem para o THIGAS AI</label>
   <textarea id="prompt" rows="2" maxlength="1600" enterkeyhint="send" placeholder="Pergunte alguma coisa...  Use @ ou / para atalhos"></textarea>
   <div class="composer-bottom">
    <div class="tool-cluster">
     <div class="combo">
      <button id="plus" type="button" class="tool icon-only" aria-label="Mais ferramentas" aria-expanded="false" aria-controls="plus-popup">＋</button>
      <div id="plus-popup" class="popup" hidden>
       <div class="popup-title">Adicionar à conversa</div>
       <button type="button" data-tool="documento"><span class="sym">▤</span><span>Enviar arquivo<small>PDF, DOCX, TXT, MD ou CSV</small></span></button>
       <button type="button" data-tool="imagem"><span class="sym">▧</span><span>Enviar imagem<small>PNG ou JPEG — leitura de texto (OCR)</small></span></button>
       <button type="button" data-tool="site"><span class="sym">↗</span><span>Analisar site<small>Extrair conteúdo de uma página HTTPS</small></span></button>
       <button type="button" data-tool="wikipedia"><span class="sym">W</span><span id="wiki-action-text">Ativar Wikipédia<small>Buscar artigos como fontes</small></span></button>
      </div>
     </div>
     <div class="combo">
      <button id="effort" type="button" class="tool" aria-label="Escolher nível de esforço" aria-expanded="false" aria-controls="effort-popup"><span>Esforço:</span> <span id="effort-label">Equilibrado</span> <span class="muted">⌄</span></button>
      <div id="effort-popup" class="popup" hidden>
       <div class="popup-title">Nível de esforço da resposta</div>
       <button type="button" data-effort="rapido"><span class="sym">⚡</span><span>Rápido<small>Respostas diretas e curtas</small></span></button>
       <button type="button" data-effort="equilibrado"><span class="sym">☷</span><span>Equilibrado<small>Explicação com contexto</small></span></button>
       <button type="button" data-effort="alto"><span class="sym">✦</span><span>Alto<small>Mais detalhes, exemplos e ressalvas</small></span></button>
      </div>
     </div>
     <button id="mic" type="button" class="tool icon-only" aria-label="Ditado por voz" title="Falar para escrever">🎤</button>
    </div>
    <button type="submit" id="send" aria-label="Enviar mensagem" disabled>↑</button>
   </div>
  </form>
  <input type="file" id="document-file" class="sr-only" accept=".pdf,.docx,.txt,.md,.csv" aria-label="Selecionar documento">
  <input type="file" id="image-file" class="sr-only" accept="image/png,image/jpeg" aria-label="Selecionar imagem">
 </div>
 <div class="status-line"><span id="status">Conectando...</span> · Use <strong>@</strong> para fontes e <strong>/</strong> para comandos. Microfone depende do navegador.</div>
</footer>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const chat=$('conversation'),scroll=$('chat-scroll'),input=$('prompt'),send=$('send');
const state={history:[],messages:[],context:null,image:null,wiki:false,busy:false,effort:'equilibrado',recording:false,recognition:null};
const labels={rapido:'Rápido',equilibrado:'Equilibrado',alto:'Alto'};
try{
 const stored=localStorage.getItem('thigas_effort');
 const old=localStorage.getItem('thigas_ai_modo');
 state.effort=labels[stored]?stored:(location.pathname==='/nano'||old==='nano'?'rapido':'equilibrado');
}catch(_){}
if(location.pathname==='/mini')state.effort='equilibrado';
function announce(s,ms=3800){
 const t=$('toast');t.textContent=s;t.hidden=false;
 clearTimeout(announce.handle);announce.handle=setTimeout(()=>{t.hidden=true},ms);
}
function jump(){scroll.scrollTop=scroll.scrollHeight}
function resize(){input.style.height='auto';input.style.height=Math.min(180,Math.max(48,input.scrollHeight))+'px';send.disabled=state.busy||(!input.value.trim()&&!state.image)}
function safeSources(items){
 return Array.isArray(items)?items.filter(x=>x&&typeof x.titulo==='string'&&typeof x.url==='string'&&x.url.startsWith('https://pt.wikipedia.org/')).slice(0,4):[];
}
function renderMessage(item){
 const article=document.createElement('article');article.className='msg '+item.role;
 if(item.role==='assistant'){
  const ava=document.createElement('div');ava.className='avatar';const img=document.createElement('img');
  img.src='/assets/capivara.svg';img.alt='THIGAS AI';ava.append(img);article.append(ava);
 }
 const body=document.createElement('div');body.className='msg-body';
 const content=document.createElement('div');content.className='msg-text';content.textContent=item.text;body.append(content);
 if(item.notice){const note=document.createElement('div');note.style.color='#8b6541';note.style.fontSize='12px';note.textContent=item.notice;body.append(note)}
 if(item.role==='assistant'){
  const sources=safeSources(item.sources);
  if(sources.length){const panel=document.createElement('div');panel.className='sources';
   sources.forEach((s,i)=>{const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='['+(i+1)+'] '+s.titulo;panel.append(a)});body.append(panel);
  }
  const actions=document.createElement('div');actions.className='message-tools';const copy=document.createElement('button');
  copy.type='button';copy.textContent='Copiar';copy.onclick=async()=>{try{await navigator.clipboard.writeText(item.text);announce('Resposta copiada.')}catch(_){announce('Não foi possível copiar.')}};actions.append(copy);body.append(actions);
 }
 article.append(body);chat.append(article);jump();return article;
}
function welcome(){
 chat.replaceChildren();
 const sec=document.createElement('section');sec.className='welcome';
 const img=document.createElement('img');img.src='/assets/capivara.svg';img.alt='';sec.append(img);
 const h=document.createElement('h1');h.textContent='Como posso ajudar?';sec.append(h);
 const p=document.createElement('p');p.textContent='Converse, pesquise na Wikipédia ou analise arquivos e sites. Ajuste o nível de esforço próximo ao botão +.';sec.append(p);
 const grid=document.createElement('div');grid.className='suggest-grid';
 const suggestions=[
  ['Pesquisar','Quem foi Albert Einstein?','wiki'],
  ['Educação','Crie uma atividade sobre cidadania digital para o 7º ano.',''],
  ['Programação','Explique como criar um jogo simples em HTML.',''],
  ['Analisar documentos','Resuma os pontos mais importantes deste arquivo.','documento']
 ];
 suggestions.forEach(([t,prompt,tool])=>{const b=document.createElement('button');b.type='button';const title=document.createElement('b');title.textContent=t;b.append(title,document.createTextNode(prompt));b.onclick=()=>{
    if(tool==='documento'){chooseTool('documento');return}
    if(tool==='wiki'){state.wiki=true;announce('Pesquisa na Wikipédia ativada.')}
    input.value=prompt;resize();input.focus();};grid.append(b)});
 sec.append(grid);chat.append(sec);
}
function updateEffort(){
 $('effort-label').textContent=labels[state.effort];
 document.querySelectorAll('[data-effort]').forEach(b=>{
  const on=b.dataset.effort===state.effort;b.classList.toggle('active',on);b.setAttribute('aria-checked',String(on))
 });
}
function chooseEffort(value){
 if(!labels[value])return;
 state.effort=value;try{localStorage.setItem('thigas_effort',value)}catch(_){}
 updateEffort();closePopups();
}
function togglePopup(button,popup){
 const open=popup.hidden;closePopups();
 if(open){popup.hidden=false;button.setAttribute('aria-expanded','true')}
}
function closePopups(){
 for(const [button,popup] of [['plus','plus-popup'],['effort','effort-popup']]){
  $(popup).hidden=true;$(button).setAttribute('aria-expanded','false');
 }
}
$('plus').onclick=()=>togglePopup($('plus'),$('plus-popup'));
$('effort').onclick=()=>togglePopup($('effort'),$('effort-popup'));
document.querySelectorAll('[data-effort]').forEach(b=>b.onclick=()=>chooseEffort(b.dataset.effort));
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>chooseTool(b.dataset.tool));
document.addEventListener('pointerdown',e=>{
 if(!e.target.closest('.combo'))closePopups();
 if(!e.target.closest('#quick-menu')&&!e.target.closest('#prompt'))hideQuick();
});
function chooseTool(name){
 closePopups();hideQuick();
 if(state.busy)return;
 if(name==='documento'){$('document-file').click();return}
 if(name==='imagem'){$('image-file').click();return}
 if(name==='site'){$('site-panel').hidden=false;$('site-url').focus();return}
 if(name==='wikipedia'){state.wiki=!state.wiki;updateWiki();announce(state.wiki?'Wikipédia ativada.':'Wikipédia desativada.');input.focus();}
}
function updateWiki(){
 $('wiki-action-text').innerHTML='';
 const title=document.createTextNode(state.wiki?'Desativar Wikipédia':'Ativar Wikipédia');
 const small=document.createElement('small');small.textContent=state.wiki?'A busca está ativada':'Buscar artigos como fontes';
 $('wiki-action-text').append(title,small);
}
function updateAttachment(){
 const a=$('attachment'),preview=$('image-preview');
 if(state.image){
  a.hidden=false;preview.hidden=false;preview.src=state.image.dados;
  $('attachment-label').textContent='Imagem: '+state.image.nome+' (OCR de texto)';
 }else if(state.context){
  a.hidden=false;preview.hidden=true;preview.removeAttribute('src');
  $('attachment-label').textContent=(state.context.tipo==='site'?'Site: ':'Arquivo: ')+state.context.titulo;
 }else{
  a.hidden=true;preview.hidden=true;preview.removeAttribute('src');
 }
}
$('remove-attachment').onclick=()=>{state.image=null;state.context=null;updateAttachment();announce('Anexo removido.')};
function fromFile(file){
 return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('Não foi possível abrir o arquivo.'));
 reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.readAsDataURL(file)});
}
async function callTool(path,payload){
 const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});
 let data={};try{data=await res.json()}catch(_){}
 if(!res.ok)throw Error(data.erro||'Não foi possível concluir a operação.');
 return data;
}
function setBusy(b){
 state.busy=b;send.disabled=b;$('plus').disabled=b;$('mic').disabled=b;
 $('document-file').disabled=b;$('image-file').disabled=b;$('load-site').disabled=b;resize();
}
$('document-file').onchange=async e=>{
 const file=e.target.files?.[0];e.target.value='';if(!file||state.busy)return;
 if(file.size>1500000){announce('Arquivo muito grande. Limite de 1,5 MB.');return}
 setBusy(true);announce('Lendo documento...',8000);
 try{
  const b64=await fromFile(file);
  const data=await callTool('/api/documento',{nome:file.name,base64:b64});
  state.context=data;state.image=null;updateAttachment();
  if(!input.value.trim())input.value='Resuma os pontos principais do documento anexado.';
  resize();announce('Documento preparado para análise.');input.focus();
 }catch(err){announce('Falha no arquivo: '+String(err.message||err),6000)}
 finally{setBusy(false)}
};
async function reduceImage(file){
 if(!/^image\/(jpeg|png)$/.test(file.type))throw Error('Use PNG ou JPEG.');
 if(file.size>10*1024*1024)throw Error('A imagem original não pode passar de 10 MB.');
 const original=URL.createObjectURL(file);
 try{
  const img=await new Promise((ok,bad)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>bad(Error('Imagem inválida.'));im.src=original});
  if(img.naturalWidth*img.naturalHeight>50_000_000)throw Error('Resolução da imagem muito alta.');
  let max=1400,quality=.82;
  for(let i=0;i<5;i++){
   const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas indisponível.');
   ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL('image/jpeg',quality);
   if(data.length<1_220_000)return data;
   max=Math.round(max*.77);quality=Math.max(.51,quality-.08);
  }
  throw Error('A imagem não pôde ser reduzida para o limite permitido.');
 }finally{URL.revokeObjectURL(original)}
}
$('image-file').onchange=async e=>{
 const file=e.target.files?.[0];e.target.value='';if(!file||state.busy)return;
 setBusy(true);announce('Preparando imagem...',7000);
 try{
  const dados=await reduceImage(file);
  state.image={nome:file.name.slice(0,120),dados};state.context=null;updateAttachment();
  if(!input.value.trim())input.value='Leia o texto legível nesta imagem e explique o conteúdo.';
  resize();announce('Imagem anexada. A análise usa OCR, não visão completa.');input.focus();
 }catch(err){announce('Falha na imagem: '+String(err.message||err),6500)}
 finally{setBusy(false)}
};
$('load-site').onclick=async()=>{
 const url=$('site-url').value.trim();
 if(!url.startsWith('https://')){announce('Informe um endereço HTTPS público.');return}
 setBusy(true);announce('Consultando página...',8000);
 try{
  const data=await callTool('/api/site',{url});
  state.context=data;state.image=null;updateAttachment();$('site-panel').hidden=true;
  if(!input.value.trim())input.value='Resuma e analise os principais pontos desta página.';
  resize();announce('Página preparada para análise.');input.focus();
 }catch(err){announce('Falha no site: '+String(err.message||err),6500)}
 finally{setBusy(false)}
};
const menuEntries=[
 {key:'@wikipedia',title:'Wikipédia',desc:'Usar artigos da Wikipédia como fontes',type:'wikipedia'},
 {key:'@arquivo',title:'Documento',desc:'Abrir seletor de arquivo',type:'documento'},
 {key:'@imagem',title:'Imagem',desc:'Anexar PNG ou JPEG para OCR',type:'imagem'},
 {key:'@site',title:'Site',desc:'Ler uma página pública HTTPS',type:'site'},
 {key:'/resumir',title:'Resumir',desc:'Criar resumo do texto ou anexo',type:'insert',insert:'Resuma com clareza e destaque os pontos principais: '},
 {key:'/explicar',title:'Explicar',desc:'Dar uma explicação didática',type:'insert',insert:'Explique de maneira didática, com exemplos: '},
 {key:'/pesquisar',title:'Pesquisar',desc:'Consultar a Wikipédia',type:'search',insert:'Pesquise na Wikipédia e cite as fontes: '},
 {key:'/codigo',title:'Programação',desc:'Gerar ou explicar código',type:'insert',insert:'Ajude-me com programação. Escreva código completo e explique: '},
 {key:'/limpar',title:'Nova conversa',desc:'Limpar mensagens e anexos',type:'clear'},
 {key:'/ajuda',title:'Ajuda',desc:'Mostrar os comandos disponíveis',type:'help'}
];
let currentMatches=[],quickIndex=0,tokenInfo=null;
function hideQuick(){currentMatches=[];tokenInfo=null;$('quick-menu').hidden=true;$('quick-menu').replaceChildren()}
function buildQuick(){
 const pos=input.selectionStart??input.value.length;
 const before=input.value.slice(0,pos);
 const found=before.match(/(^|\s)([@/])([a-zA-ZÀ-ÿ-]*)$/);
 if(!found){hideQuick();return}
 const prefix=found[2],query=found[3].toLocaleLowerCase('pt-BR');
 const entries=menuEntries.filter(e=>e.key.startsWith(prefix)&&e.key.toLocaleLowerCase('pt-BR').includes(query)).slice(0,8);
 if(!entries.length){hideQuick();return}
 currentMatches=entries;quickIndex=0;
 tokenInfo={start:pos-(prefix.length+found[3].length),end:pos};
 renderQuick();
}
function renderQuick(){
 const list=$('quick-menu');list.replaceChildren();list.hidden=false;
 currentMatches.forEach((e,i)=>{
  const b=document.createElement('button');b.type='button';b.className=i===quickIndex?'active':'';
  b.setAttribute('role','option');b.setAttribute('aria-selected',String(i===quickIndex));
  const sym=document.createElement('strong');sym.textContent=e.key;
  const text=document.createElement('span');text.textContent=e.title;
  const desc=document.createElement('small');desc.textContent=e.desc;text.append(desc);
  b.append(sym,text);b.onmousedown=ev=>ev.preventDefault();b.onclick=()=>applyQuick(e);
  list.append(b);
 });
}
function applyQuick(entry){
 const t=tokenInfo;if(!t)return;
 const initial=input.value,head=initial.slice(0,t.start),tail=initial.slice(t.end);
 input.value=head+(entry.insert||'')+tail;hideQuick();resize();
 if(entry.type==='wikipedia'){state.wiki=true;updateWiki();announce('Wikipédia ativada.')}
 else if(entry.type==='documento'||entry.type==='imagem'||entry.type==='site'){chooseTool(entry.type)}
 else if(entry.type==='search'){state.wiki=true;updateWiki()}
 else if(entry.type==='clear'){newChat();return}
 else if(entry.type==='help'){announce('Use @wikipedia, @arquivo, @imagem, @site e /resumir, /explicar, /pesquisar, /codigo, /limpar.',7800)}
 input.focus();
}
input.addEventListener('input',()=>{resize();buildQuick()});
input.addEventListener('click',()=>{if(!$('quick-menu').hidden)buildQuick()});
input.addEventListener('keydown',e=>{
 if(!$('quick-menu').hidden){
  if(e.key==='ArrowDown'){e.preventDefault();quickIndex=(quickIndex+1)%currentMatches.length;renderQuick();return}
  if(e.key==='ArrowUp'){e.preventDefault();quickIndex=(quickIndex+currentMatches.length-1)%currentMatches.length;renderQuick();return}
  if(e.key==='Escape'){e.preventDefault();hideQuick();return}
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();applyQuick(currentMatches[quickIndex]);return}
 }
 if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composer').requestSubmit()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopups();hideQuick();$('site-panel').hidden=true}});
function newChat(){
 if(state.busy)return;
 state.history=[];state.messages=[];state.context=null;state.image=null;
 state.wiki=false;updateWiki();updateAttachment();input.value='';resize();
 $('site-panel').hidden=true;hideQuick();closePopups();welcome();input.focus();
}
$('new-chat').onclick=newChat;
// Ditado, com consentimento solicitado pelo navegador no clique do microfone.
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{
 if(!SR){announce('Ditado não disponível neste navegador. Use o microfone do teclado do celular.',6500);return}
 if(state.recording){state.recognition?.stop();return}
 if(state.busy)return;
 const rec=new SR();state.recognition=rec;rec.lang='pt-BR';rec.interimResults=true;rec.continuous=false;
 let base=input.value.trim();let lastText='';
 rec.onstart=()=>{state.recording=true;$('mic').dataset.listening='true';$('mic').setAttribute('aria-label','Parar ditado');announce('Ouvindo… fale em português.')};
 rec.onresult=ev=>{
  let text='';for(let i=0;i<ev.results.length;i++)text+=ev.results[i][0].transcript+' ';
  lastText=text.trim();input.value=(base?base+' ':'')+lastText;resize();
 };
 rec.onerror=ev=>{if(ev.error==='not-allowed')announce('Permissão do microfone recusada.');else if(ev.error!=='no-speech')announce('Ditado interrompido: '+ev.error)};
 rec.onend=()=>{state.recording=false;delete $('mic').dataset.listening;$('mic').setAttribute('aria-label','Ditado por voz');state.recognition=null;input.focus()};
 try{rec.start()}catch(_){announce('Não foi possível iniciar o ditado.')}
};
function removeWikiMention(text){
 const found=/(?:^|\s)@(?:wikipedia|wiki)\b/iu.test(text);
 return {found,text:text.replace(/(?:^|\s)@(?:wikipedia|wiki)\b/giu,' ').trim()};
}
$('composer').addEventListener('submit',async event=>{
 event.preventDefault();if(state.busy)return;
 hideQuick();closePopups();
 const parsed=removeWikiMention(input.value.trim());
 const hasImage=!!state.image;
 const q=parsed.text||(hasImage?'Extraia o texto legível da imagem e explique.':'');
 if(!q)return;
 if(q.length>1600){announce('Pergunta muito longa. Limite de 1600 caracteres.');return}
 if($('site-panel').hidden===false){$('site-panel').hidden=true}
 const wiki=state.wiki||parsed.found;
 const attachment=state.image,context=state.context,effort=state.effort;
 input.value='';resize();
 const welcomeNode=chat.querySelector('.welcome');if(welcomeNode)welcomeNode.remove();
 const visible=q+(attachment?'\n[Imagem anexada: '+attachment.nome+']':'')+(context?'\n[Referência: '+context.titulo+']':'');
 renderMessage({role:'user',text:visible});
 state.messages.push({role:'user',text:q});
 const pending=renderMessage({role:'assistant',text:wiki?'Consultando fontes e preparando resposta...':attachment?'Lendo o texto da imagem...':'Preparando resposta...'});
 pending.classList.add('pending');
 setBusy(true);
 try{
  const payload={modo:effort==='rapido'?'nano':'mini',esforco:effort,
   pergunta:q,historico:state.history.slice(-8),wikipedia:wiki,contexto:context,imagem:attachment};
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});
  let data={};try{data=await res.json()}catch(_){}
  if(!res.ok)throw Error(data.erro||'HTTP '+res.status);
  pending.remove();
  const answer={role:'assistant',text:data.resposta||'Não foi possível gerar texto.',sources:data.fontes||[],notice:data.aviso||''};
  state.messages.push(answer);renderMessage(answer);
  state.history.push({role:'user',content:q},{role:'assistant',content:answer.text});state.history=state.history.slice(-8);
  if(attachment===state.image){state.image=null;updateAttachment()}
 }catch(err){pending.remove();
  const message='Não consegui responder agora: '+String(err.message||'Falha de conexão.');
  state.messages.push({role:'assistant',text:message});renderMessage({role:'assistant',text:message});
 }finally{setBusy(false);input.focus()}
});
fetch('/api/status',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(Error('offline'))).then(d=>{
 $('status').textContent=d.ok?'● THIGAS AI online':'Servidor iniciando';
}).catch(()=>{$('status').textContent='Sem conexão com o servidor'});
updateEffort();updateWiki();updateAttachment();resize();welcome();
let pendingInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pendingInstall=e;$('install-pwa').hidden=false});
$('install-pwa').onclick=async()=>{if(!pendingInstall)return;const p=pendingInstall;pendingInstall=null;$('install-pwa').hidden=true;try{await p.prompt()}catch(_){}};
window.addEventListener('appinstalled',()=>{pendingInstall=null;$('install-pwa').hidden=true});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{}));
}
